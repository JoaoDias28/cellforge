name: CI

"on":
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12 validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.0"
          enable-cache: true
      - name: Install Python
        run: uv python install 3.12
      - name: Lint and type-check
        run: make lint
      - name: Run unit tests
        run: make test

  ros-jazzy:
    name: ROS 2 Jazzy build and test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure ROS 2 repositories
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy
      - name: Resolve ROS package dependencies
        run: |
          set +e
          echo "=== rosdep update ==="
          rosdep update 2>&1
          UPDATE_RC=$?
          echo "rosdep update exit code: $UPDATE_RC"
          echo "=== rosdep install ==="
          rosdep install --from-paths ros_ws/src --ignore-src --rosdistro jazzy --yes 2>&1
          INSTALL_RC=$?
          echo "rosdep install exit code: $INSTALL_RC"
          if [ $UPDATE_RC -ne 0 ]; then exit $UPDATE_RC; fi
          if [ $INSTALL_RC -ne 0 ]; then exit $INSTALL_RC; fi
      - name: Build ROS workspace
        run: make ros-build
      - name: Test ROS workspace
        run: make ros-test
