[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cellforge-domain"
version = "0.1.0"
description = "Pure domain models and validation logic for CellForge"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.25,<5",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cellforge_domain"]
