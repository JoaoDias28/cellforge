[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cellforge-cli"
version = "0.1.0"
description = "Headless engineering CLI for CellForge projects"
requires-python = ">=3.12"
dependencies = ["cellforge-bundle==0.1.0", "cellforge-domain==0.1.0"]

[project.scripts]
cellforge = "cellforge_cli.main:main"

[tool.uv.sources]
cellforge-bundle = { workspace = true }
cellforge-domain = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cellforge_cli"]

[tool.hatch.build.targets.wheel.force-include]
"../../../schemas" = "cellforge_cli/resources/schemas"
"../../../examples/pen_engraving" = "cellforge_cli/resources/examples/pen_engraving"
