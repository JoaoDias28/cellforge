[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "cellforge-bundle"
version = "0.1.0"
description = "Deterministic CellForge cell compiler and bundle manifest builder"
requires-python = ">=3.12"
dependencies = ["cellforge-domain==0.1.0"]

[tool.uv.sources]
cellforge-domain = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/cellforge_bundle"]
