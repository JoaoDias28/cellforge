[project]
name = "cellforge-workspace"
version = "0.0.0"
description = "Development workspace for CellForge Python packages"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "fastapi>=0.100,<1",
  "httpx>=0.27,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pyyaml>=6,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0.12,<7",
  "uvicorn>=0.23,<1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/python/*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["src/python/cellforge_domain/tests", "src/python/cellforge_bundle/tests", "src/python/cellforge_cli/tests", "src/kit/cellforge.studio/tests", "tests"]
pythonpath = ["src/kit/cellforge.studio"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cellforge"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src/kit/cellforge.studio"

[[tool.mypy.overrides]]
module = [
    "rclpy", "rclpy.*",
    "launch", "launch.*",
    "launch_ros", "launch_ros.*",
    "ament_index_python", "ament_index_python.*",
    "builtin_interfaces", "builtin_interfaces.*",
    "cellforge_interfaces", "cellforge_interfaces.*",
    "cellforge_operator_api", "cellforge_operator_api.*",
    "cellforge_simulation", "cellforge_simulation.*",
    "geometry_msgs", "geometry_msgs.*",
    "std_msgs", "std_msgs.*",
    "omni", "omni.*",
    "isaacsim", "isaacsim.*",
    "pxr", "pxr.*",
]
ignore_missing_imports = true
