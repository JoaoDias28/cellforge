[project]
name = "cellforge-workspace"
version = "0.0.0"
description = "Development workspace for CellForge Python packages"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pyyaml>=6,<7",
  "ruff>=0.12,<1",
  "types-jsonschema>=4.25,<5",
  "types-pyyaml>=6.0.12,<7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["src/python/*"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
testpaths = ["src/python/cellforge_domain/tests", "src/python/cellforge_bundle/tests", "src/python/cellforge_cli/tests", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
