schema_version: 0.1.0
scenario:
  id: pen-nominal
  name: Nominal pen engraving
  seed: 1001
  timeout_seconds: 60
job:
  recipe_id: pen-aluminium-reference
  recipe_version: 1
  input_payload:
    engraving_text: CELLFORGE
initial_state:
  product_present: true
  safety_healthy: true
  laser_ready: true
randomization:
  product_x_mm: {distribution: uniform, min: -1.0, max: 1.0}
  product_y_mm: {distribution: uniform, min: -1.0, max: 1.0}
faults: []
assertions:
  final_status: SUCCESS
  required_events:
    - process.command.completed
    - inspection.accepted
    - job.completed
  forbidden_events:
    - safety.bypass
  max_cycle_seconds: 45
