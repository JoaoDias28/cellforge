schema_version: 0.1.0
scenario: {id: pen-operator-cancel, name: Operator cancel before process, seed: 1009, timeout_seconds: 60}
job:
  recipe_id: pen-aluminium-reference
  recipe_version: 1
  input_payload: {engraving_text: CANCEL}
initial_state: {product_present: true, safety_healthy: true, laser_ready: true}
faults:
  - {at: before:SelectProcessProgram, target: operator, fault: operator_cancelled, parameters: {}}
assertions:
  final_status: CANCELLED
  required_events: [operator.cancelled, job.cancelled]
  forbidden_events: [process.command.requested, job.completed]
