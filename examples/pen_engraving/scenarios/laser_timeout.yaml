schema_version: 0.1.0
scenario:
  id: pen-laser-timeout
  name: Laser cycle timeout
  seed: 1002
  timeout_seconds: 60
job:
  recipe_id: pen-aluminium-reference
  recipe_version: 1
  input_payload:
    engraving_text: TIMEOUT
initial_state:
  product_present: true
  safety_healthy: true
  laser_ready: true
faults:
  - at: before:ExecuteProcess
    target: laser-001
    fault: laser.process.timeout
    parameters: {}
assertions:
  final_status: RECOVERABLE_FAULT
  required_events:
    - laser.process.timeout
    - job.failed
  forbidden_events:
    - job.completed
