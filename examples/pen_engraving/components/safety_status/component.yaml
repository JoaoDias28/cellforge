schema_version: 0.1.0
component:
  id: generic.external_safety_status.reference
  version: 0.1.0
  kind: safety_device
  name: External safety status model
  manufacturer: Generic
  model: SAFETY-STATUS-REF
  description: Models read-only status from independent rated safety hardware. It does not implement safety functions.
  license: Apache-2.0
assets:
  visual_usd: assets/safety_visual.usd
  collision_usd: assets/safety_collision.usd
frames:
  - id: root
    role: root
    usd_prim: /SafetyStatus/root
ports:
  mechanical: []
  software: []
  industrial_io: []
  safety:
    - id: laser_emission_permitted
      direction: output
      type: safety.status.laser_emission_permitted
      required: true
    - id: safe_motion_permitted
      direction: output
      type: safety.status.safe_motion_permitted
      required: true
config_schema: config.schema.json
capabilities: []
adapters:
  simulation:
    package: cellforge_simulation
    entrypoint: isaac_l2_adapter
    minimum_version: 0.1.0
    fidelity: L2
  hardware:
    package: cellforge_hardware_adapters
    entrypoint: hardware_safety_status_node
    minimum_version: 0.1.0
support:
  level: production_qualified
  simulation_level: L2
  owner: safety-integration
