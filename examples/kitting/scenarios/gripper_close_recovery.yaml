schema_version: 0.1.0
scenario:
  id: kitting-gripper-recovery
  name: Recover one gripper close fault during tray kitting
  seed: 3802
  timeout_seconds: 60
simulation:
  requested_fidelity: L0
job:
  recipe_id: two-part-kit-reference
  recipe_version: 1
  input_payload:
    kit_sku: KIT-2PART-REF
    parts:
      - sku: PART-A
        slot: slot_1
      - sku: PART-B
        slot: slot_2
initial_state:
  parts_present: true
  kit_tray_seated: true
  inspection_passed: true
  safety_healthy: true
randomization:
  part_1_x_mm: {distribution: uniform, min: -1.0, max: 1.0}
  part_2_x_mm: {distribution: uniform, min: -1.0, max: 1.0}
faults:
  - at: before:PickObject
    target: gripper-001
    fault: gripper.motion.close_failed
    parameters:
      recovery: retry
      max_attempts: 2
assertions:
  final_status: SUCCESS
  required_events:
    - fault.injected
    - gripper.motion.close_failed
    - recovery.retry.requested
    - fault.recovered
    - kitting.result.recorded
    - job.completed
  forbidden_events:
    - safety.bypass
  max_cycle_seconds: 45
